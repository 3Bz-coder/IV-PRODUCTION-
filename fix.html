<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
<title>IV — إصلاح</title>
</head>
<body style="margin:0;background:#efe6d6;color:#4a3520;font-family:system-ui,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;text-align:center;padding:24px">
<div>
  <div style="font-size:32px;font-weight:800;letter-spacing:.15em">IV</div>
  <p id="msg" style="margin-top:16px;font-size:15px;line-height:1.7">جاري إصلاح بيانات الجهاز…</p>
  <p style="font-size:12px;opacity:.6;margin-top:12px">لن تُحذف أعمالك من السحابة — فقط الكاش المحلي</p>
</div>
<script>
(function(){
  var BUILD="20260921m";
  function wipe(){
    try{
      var keep=[];
      // امسح كل مفاتيح iv
      var keys=[];
      for(var i=0;i<localStorage.length;i++){
        var k=localStorage.key(i);
        if(k && (k.indexOf("iv")===0 || k.indexOf("firebase")>=0)) keys.push(k);
      }
      keys.forEach(function(k){ localStorage.removeItem(k); });
      sessionStorage.clear();
    }catch(e){}
    try{
      if(navigator.serviceWorker){
        navigator.serviceWorker.getRegistrations().then(function(rs){
          (rs||[]).forEach(function(r){ r.unregister(); });
        });
      }
    }catch(e){}
    try{
      if(window.caches){
        caches.keys().then(function(ks){
          (ks||[]).forEach(function(k){ caches.delete(k); });
        });
      }
    }catch(e){}
  }
  wipe();
  setTimeout(function(){
    var m=document.getElementById("msg");
    if(m) m.textContent="تم الإصلاح — جاري فتح الموقع…";
    location.replace("app.html?v="+BUILD+"&reset=1&t="+Date.now());
  }, 900);
})();
</script>
</body>
</html>
