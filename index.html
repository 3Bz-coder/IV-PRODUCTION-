<title>IV PRODUCTION</title>
<!-- IV_BOOT: 20260921d -->
<script>
(function () {
  var BUILD = "20260921d";
  var target = "app.html";

  function go() {
    var u = target + "?v=" + encodeURIComponent(BUILD) + "&t=" + Date.now();
    try { location.replace(u); } catch (e) { location.href = u; }
  }

  try {
    localStorage.setItem("iv_boot_build", BUILD);
    localStorage.setItem("iv_last_build", BUILD);
  } catch (e) {}

  try {
    if (navigator.serviceWorker) {
      navigator.serviceWorker.getRegistrations().then(function (rs) {
        (rs || []).forEach(function (r) { try { r.unregister(); } catch (e) {} });
      });
    }
  } catch (e) {}

  try {
    if (window.caches && caches.keys) {
      caches.keys().then(function (ks) {
        (ks || []).forEach(function (k) { try { caches.delete(k); } catch (e) {} });
      });
    }
  } catch (e) {}

  // امسح مفاتيح الكاش القديمة للموقع فقط
  try {
    var kill = [];
    for (var i = 0; i < localStorage.length; i++) {
      var k = localStorage.key(i);
      if (k && /^iv_forced_/.test(k)) kill.push(k);
    }
    kill.forEach(function (k) { localStorage.removeItem(k); });
  } catch (e) {}

  go();
  setTimeout(go, 400);
  setTimeout(go, 1200);
})();
</script>

      <a href="app.html?v=20260921d" style="color:#6b4a28;font-weight:700">اضغط هنا</a>
    </p>
  </div>
</body>
