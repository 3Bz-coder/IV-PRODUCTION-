<head>

<title>IV PRODUCTION</title>
<!-- IV_BOOT: 20260921j -->
<script>
(function(){
  var BUILD="20260921j";
  try{ localStorage.setItem("iv_boot_build", BUILD); }catch(e){}
  try{
    if(navigator.serviceWorker){
      navigator.serviceWorker.getRegistrations().then(function(rs){
        (rs||[]).forEach(function(r){ try{r.unregister()}catch(e){} });
      });
    }
  }catch(e){}
  // إذا زيارة سابقة فشلت (مكتبة فاضية) → صفحة الإصلاح
  var broken=false;
  try{
    var tr=localStorage.getItem("ivlive_tracks");
    if(tr==="[]" || tr==="null") broken=true;
    if(localStorage.getItem("iv_ui_broken")==="1") broken=true;
  }catch(e){}
  if(broken){
    location.replace("fix.html?t="+Date.now());
    return;
  }
  location.replace("app.html?v="+BUILD+"&t="+Date.now());
})();
</script>
</head>
<body style="margin:0;background:#efe6d6;display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:system-ui;color:#6b4a28">

    <div style="font-weight:800;letter-spacing:.12em;font-size:28px">IV</div>

    </p>
  </div>
</body>
